<ng-container *ngIf="{user: (vm$ | async)?.user, hobbies: (vm$ | async)?.hobbies} as vm">
  <ion-header class="ion-no-padding ion-padding-top ion-padding-horizontal">
    <ion-toolbar>
      <div class="toolbar-space">
        <h1>Hi {{ vm?.user?.displayName}},</h1>
        <h2 class="what-like-to-play ion-padding-bottom">
          Choose a room and<br />
          see who's around?
        </h2>
      </div>
      <ion-buttons slot="end">
        <ion-button color="dark" (click)="openFilters()" style="height: auto">
          <div class="cust-inner-button">
            <!-- <ion-icon slot="icon-only" name="search-sharp"></ion-icon> -->
            <img src="../../assets/icon/search_add.svg" style="height: 30px" />
            <div class="cust-search-setting">
              Search<br />
              Settings
            </div>
          </div>
        </ion-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>
  <ion-content>
    <ion-row class="w-100 ion-no-padding">
      <ion-col class="ion-align-self-center" size="6">
        <ion-row class="ion-no-padding">
          <ng-container *ngFor="let room of left_row; let i = index">
            <ion-col size="12">
              <ion-card
                [ngClass]="room.isComingSoon ? 'disabled-card' : ''"
                class="card ion-no-margin ion-activatable ripple-parent rounded-rectangle"
                (click)="onRoomClick(room)"
                style="
                  background-image: url('{{room.image}}');
                  background-position: center;
                  background-size: cover;
                "
              >
                <ion-ripple-effect></ion-ripple-effect>

                <ion-card-content class="ion-no-padding">
                  <div class="content-main">
                    <h3 class="card-title">{{room.isComingSoon ? "Coming Soon" : room.name}}</h3>
                  </div>
                </ion-card-content>
              </ion-card>
            </ion-col>
          </ng-container>
        </ion-row>
      </ion-col>
      <ion-col size="6">
        <ion-row class="ion-no-padding">
          <ion-col
            size="12"
            class="ion-text-center ion-justify-content-center ion-align-items-center"
          >
            <div class=" ion-margin-top ion-text-center">
              <ion-button class="text-color-white anyone-ready-btn" shape="round" expand="block" (click)="anyoneReadyNow()">
                {{ 'Anyone ready now ?' | titleCase }}
              </ion-button>
            </div>
          </ion-col>
          <ng-container *ngFor="let room of right_row; let i = index">
            <ion-col size="12">
              <ion-card
                [ngClass]="room.isComingSoon ? 'disabled-card' : ''"
                class="card ion-no-margin ion-activatable ripple-parent rounded-rectangle"
                (click)="onRoomClick(room)"
                style="
                      background-image: url('{{room.image}}');
                      background-position: center;
                      background-size: cover;
                    "
              >
                <ion-ripple-effect></ion-ripple-effect>

                <ion-card-content class="ion-no-padding">
                  <div class="content-main">
                    <h3 class="card-title">{{room.isComingSoon ? "Coming Soon" : room.name}}</h3>
                  </div>
                </ion-card-content>
              </ion-card>
            </ion-col>
          </ng-container>
        </ion-row>
      </ion-col>
    </ion-row>
  </ion-content>
</ng-container>
