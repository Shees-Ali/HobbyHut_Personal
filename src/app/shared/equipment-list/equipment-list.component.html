<swiper-container #slides [slidesPerView]=1 (swiperslidechange)="slideChanged()">
    <swiper-slide *ngFor="let activeHobby of HobbiesArray">
        <div class="d-flex ion-justify-content-between ion-align-items-center w-100">
            <div class="profile-details-skills">{{ activeHobby?.name }}</div>
            <div class="reverse-badge">
                <div class="skill-icon-wrapper" [ngClass]="['skill-icon-' + (activeHobby?.skillLevel ? activeHobby.skillLevel.toLowerCase() : 'beginner')]"></div>
                <div class="d-flex">
                    <div *ngFor="let item of activeHobby?.meta | keyvalue">
                        <div class="skill-level-bg" *ngIf="item.key === 'facilities' && item.value">
                            <img class="profile-details-icon" src="assets/icon/keys.png" alt="" />
                        </div>
                        <div class="skill-level-bg" *ngIf="item.key === 'equipment' && item.value">
                            <img class="profile-details-icon" src="assets/icon/paddle.png" alt="" />
                        </div>
                        <div class="skill-level-bg" *ngIf="item.key === 'coach' && item.value">
                            <img class="profile-details-icon" src="assets/icon/cap.png" alt="" />
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </swiper-slide>
</swiper-container>

<div *ngIf="callFromHome" class="d-flex c-flex-box-column">
    <ng-container *ngFor="let item of hobbies?.meta | keyvalue">
        <div class="skill-level-bg" *ngIf="item.key === 'facilities' && item.value">
            <img class="profile-details-icon" src="assets/icon/keys.png" alt="" />
        </div>
        <div class="skill-level-bg" *ngIf="item.key === 'equipment' && item.value">
            <img class="profile-details-icon" src="assets/icon/paddle.png" alt="" />
        </div>
        <div class="skill-level-bg" *ngIf="item.key === 'coach' && item.value">
            <img class="profile-details-icon" src="assets/icon/cap.png" alt="" />
        </div>
    </ng-container>
</div>
