<ion-button
  class="timer-btn"
  fill="clear"
  id="demo"
  #demo
  [ngClass]="{'timer-btn-active': isRunning(), 'grayscale-timer': !isRunning()}"
  [disabled]="!displayHobbyId"
  (click)="toggleTimer()"
>
  <ng-container *ngIf="isRunning(); else startUp">
    <div>
      <span
        class="countdown-time c-countdown-time-active"
        [ngClass]="timerService.isUnderOneMinute(displayHobbyId) ? 'left-22' : ''"
      >
        {{ timerService.getDisplayValue(displayHobbyId) }}
        <span class="super">{{ timerService.isUnderOneMinute(displayHobbyId) ? 'secs' : 'mins' }}</span>
      </span>
    </div>
  </ng-container>

  <ng-template #startUp>
    <span class="countdown-time countdown-time-not-started">
      30 <span class="super">mins</span>
    </span>
  </ng-template>

  <div class="round-space" *ngIf="isRunning()"></div>
  <p class="countdown-copy">Ready Now!</p>
  <img class="timer-img" src="assets/icon/clock6_1.svg" alt="" />
  <div class="timer-img-bg"></div>
  <div class="border-grey"></div>

  <!-- gif -->
  <div class="gif-wrapper" *ngIf="isRunning()">
    <svg
      version="1.1"
      id="circle"
      xmlns="http://www.w3.org/2000/svg"
      xmlns:xlink="http://www.w3.org/1999/xlink"
      x="0px"
      y="0px"
      viewBox="0 0 100 100"
      xml:space="preserve"
    >
      <circle
        fill="none"
        stroke="#ffc001"
        stroke-width="5.6"
        stroke-mitterlimit="0"
        cx="50"
        cy="50"
        r="47"
        stroke-dasharray="360"
        stroke-linecap="round"
        transform="rotate(-90 ) translate(-100 0)"
      >
        <animate
          attributeName="stroke-dashoffset"
          values="360;0"
          dur="1s"
          repeatCount="indefinite"
        ></animate>
      </circle>
    </svg>
  </div>
  <!-- gif -->
</ion-button>
